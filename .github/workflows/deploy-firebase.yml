name: Deploy Firebase (rules, indexes, functions)

# The GitHub Pages workflow only ships the static frontend. This one keeps
# the backend in sync: Firestore rules/indexes, Storage rules and Cloud
# Functions are deployed whenever they change on main.
#
# Requires a repository secret named FIREBASE_SERVICE_ACCOUNT containing the
# JSON key of a service account with the "Firebase Admin" and "Cloud
# Functions Developer" roles (Firebase console → Project settings →
# Service accounts → Generate new private key).

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - "functions/**"
      - .github/workflows/deploy-firebase.yml
  workflow_dispatch:

# The CLI is pinned to an exact version: this job holds the Firebase Admin key, so a new release must not run
# with it unreviewed. Bump the version here on purpose (and read the release notes) rather than via `latest`.
env:
  FIREBASE_TOOLS_VERSION: 15.32.1

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Configure App Check rollout
        env:
          APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
        run: |
          case "$APP_CHECK_MODE" in off|monitor|enforce) ;; *) echo "::error::Invalid APP_CHECK_MODE"; exit 1 ;; esac
          printf 'APP_CHECK_MODE=%s\n' "$APP_CHECK_MODE" > functions/.env.lyricalmyrical-web-v2

      - name: Keep old function images from piling up (best effort)
        # Without `--force` a non-interactive deploy exits non-zero when the Artifact Registry repository has no
        # cleanup policy ("Functions successfully deployed but could not set up cleanup policy"). Set that one
        # policy here with the narrow command instead of putting `--force` on the whole deploy. Needs the CI
        # account to hold artifactregistry.repositories.update; if it cannot, run the same command once by hand.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || exit 0
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" functions:artifacts:setpolicy \
            --project lyricalmyrical-web-v2 --location us-central1 --days 30 --force --non-interactive

      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — backend NOT deployed. Add it in repo Settings → Secrets and actions."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # No `--force`: it also deletes, unasked, indexes created in the console and functions missing from the
          # repo. Without it the CLI keeps them and says what it left (delete deliberately with
          # `firebase functions:delete` / by editing firestore.indexes.json).
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --only firestore:rules,firestore:indexes,storage,functions \
            --project lyricalmyrical-web-v2 \
            --non-interactive
