name: CI

# Runs the full test suite, a production bundle build and the type-check ratchet on
# every pull request and on main, so contract tests (Studio coverage, section parity,
# copy coverage…) actually guard changes before they ship.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request replaces the older run. Runs on main are per commit and never cancelled:
# several merges in a row used to cancel each other's checks and leave red "cancelled" marks on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same exact version as deploy-firebase.yml and deploy-pages.yml (scripts/hostingConfig.test.ts).
env:
  FIREBASE_TOOLS_VERSION: 15.32.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vitest also runs the Cloud Functions tests, which load the functions' own packages.
      - run: npm ci
        working-directory: functions

      # The Firebase deploy loads functions/index.js before it uploads anything; tests mock firebase-admin, so a
      # package update that breaks that load (firebase-admin 14 removed admin.firestore()) only failed after merge.
      - name: Cloud Functions load like the deploy
        working-directory: functions
        run: node -e "const n = Object.keys(require('./index.js')).length; if (!n) throw new Error('functions/index.js exports no functions'); console.log(n + ' functions load')"

      - name: Tests
        run: pnpm test

      - name: Type-check (no new errors)
        run: pnpm run typecheck

      # Bundle only: the full `build` also prerenders live Firestore data, which the storefront workflow does.
      - name: Build
        run: pnpm exec vite build

      # That build served by the real Firebase Hosting emulator: firebase.json routing and headers are checked before
      # they can reach the live shop. No prerender here, so prerendered-page checks are skipped; the deploy workflow
      # runs them on the full build.
      - name: Firebase Hosting routing check
        run: npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only hosting --project demo-lyricalmyrical "node scripts/hosting-smoke.mjs"

  studio-browser:
    # Drives the real Design studio in Chromium against the local fixture (studio-fixture.html):
    # in-memory data, no sign-in, nothing written to Firestore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Studio browser checks
        run: pnpm run test:studio
        env:
          STUDIO_SHOTS: studio-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: studio-shots
          if-no-files-found: ignore

  studio-controls:
    # Changes every Studio control in the fixture's preview of the live design and fails when one that used to
    # change the page no longer does, or a new control has no entry in scripts/studio-control-baseline.json
    # (CLAUDE.md › Studio controls must reach the shop).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Every Studio control still reaches the preview
        run: node scripts/studio-control-audit.mjs
        env:
          AUDIT_CHECK: "1"
          AUDIT_OUT: studio-control-audit.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-control-audit
          path: studio-control-audit.json
          if-no-files-found: ignore
