name: CI

# Runs the full test suite, a production bundle build and the type-check ratchet on
# every pull request and on main, so contract tests (Studio coverage, section parity,
# copy coverage…) actually guard changes before they ship.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same exact version as deploy-firebase.yml and deploy-pages.yml (scripts/hostingConfig.test.ts).
env:
  FIREBASE_TOOLS_VERSION: 15.32.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vitest also runs the Cloud Functions tests, which load the functions' own packages.
      - run: npm ci
        working-directory: functions

      - name: Tests
        run: pnpm test

      - name: Type-check (no new errors)
        run: pnpm run typecheck

      # Bundle only: the full `build` also prerenders live Firestore data, which the Pages workflow does.
      - name: Build
        run: pnpm exec vite build

      # The Firebase Hosting build (site at the root, app shell as 404.html) served by the real Hosting emulator:
      # firebase.json routing and headers are checked before they can reach the live site. No prerender here,
      # so prerendered-page checks are skipped; the deploy workflow runs them on the full build.
      - name: Firebase Hosting routing check
        run: |
          SITE_BASE=/ SITE_URL=https://lyricalmyrical-web-v2.web.app SPA_FALLBACK=shell pnpm exec vite build
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only hosting --project demo-lyricalmyrical "node scripts/hosting-smoke.mjs --expect-noindex"

  studio-browser:
    # Drives the real Design studio in Chromium against the local fixture (studio-fixture.html):
    # in-memory data, no sign-in, nothing written to Firestore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Studio browser checks
        run: pnpm run test:studio
        env:
          STUDIO_SHOTS: studio-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots
          path: studio-shots
          if-no-files-found: ignore
