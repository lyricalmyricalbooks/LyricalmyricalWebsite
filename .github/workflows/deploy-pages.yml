name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # Deploy order contract (CLAUDE.md): Firestore rules, indexes and Functions go live BEFORE the frontend that
  # depends on them. When this push also changed a path deploy-firebase.yml watches, wait for that run and
  # require it to succeed. Scheduled and manual builds change no backend files, so they pass straight through.
  firebase-first:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Firebase deploy when this push changed backend files
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Keep this list identical to `on.push.paths` in deploy-firebase.yml.
          WATCHED='^(firestore\.rules|firestore\.indexes\.json|storage\.rules|firebase\.json|functions/.*|\.github/workflows/deploy-firebase\.yml)$'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare; treating backend files as changed."
            expect=true
          else
            files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || {
              echo "::error::Could not list the files changed by this push, so the Firebase deploy order cannot be checked. Re-run this workflow."
              exit 1
            }
            if printf '%s\n' "$files" | grep -Eq "$WATCHED"; then expect=true; else expect=false; fi
          fi
          if [ "$expect" != "true" ]; then
            echo "No Firebase files changed in this push; publishing the frontend straight away."
            exit 0
          fi
          echo "Backend files changed; waiting for the Firebase deploy of $SHA to finish first."
          deadline=$(( $(date +%s) + 2100 ))
          seen_at=$(( $(date +%s) + 300 ))
          while :; do
            run=$(gh run list --repo "$REPO" --workflow deploy-firebase.yml --commit "$SHA" --event push \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r .status)
              if [ "$status" = "completed" ]; then
                conclusion=$(printf '%s' "$run" | jq -r .conclusion)
                if [ "$conclusion" = "success" ]; then echo "Firebase deploy succeeded; continuing."; exit 0; fi
                echo "::error::The Firebase deploy ended as '$conclusion' ($(printf '%s' "$run" | jq -r .url)). The frontend was NOT published, so it cannot run ahead of its rules and Functions. Fix it and re-run, or start this workflow by hand once the backend is current."
                exit 1
              fi
            elif [ "$(date +%s)" -gt "$seen_at" ]; then
              echo "::error::Backend files changed but no Firebase deploy run appeared for $SHA within 5 minutes."
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "::error::Timed out waiting for the Firebase deploy."; exit 1; fi
            sleep 20
          done

  deploy:
    needs: firebase-first
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves a project site at /<repository name>/. Take the address from the repository's current name
      # so renaming the repository can never leave the build pointing at a sub-path that 404s (unstyled site).
      # A custom domain sets the repository variable SITE_URL (e.g. https://shop.example.com) instead.
      - name: Site address
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${CUSTOM_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          url="${url%/}"
          path="$(node -e 'process.stdout.write(new URL(process.argv[1]).pathname.replace(/\/+$/, ""))' "$url")"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "SITE_BASE=$path/" >> "$GITHUB_ENV"
          echo "Building for $url (base $path/)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check published content
        id: published
        if: github.event_name == 'schedule'
        run: node scripts/check-published-change.mjs

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - name: Build with reCAPTCHA App Check configuration
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
        run: |
          case "$VITE_APP_CHECK_MODE" in off|monitor|enforce) ;; *) echo "::error::Invalid APP_CHECK_MODE"; exit 1 ;; esac
          if [ "$VITE_APP_CHECK_MODE" = "enforce" ] && [ -z "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "::error::Register reCAPTCHA Enterprise and set RECAPTCHA_ENTERPRISE_SITE_KEY before enforcing App Check."
            exit 1
          fi
          pnpm run build
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      # Pages replaces the whole site; keep the previous build's CSS/JS so pages cached before this deploy still load styled.
      - name: Keep the previous deploy's assets
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        run: node scripts/carry-previous-assets.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        with:
          path: ./dist

      - id: deployment
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
