name: Deploy storefront

# Builds the storefront and publishes it to GitHub Pages (the live shop) and, side by side, to Firebase Hosting
# (https://lyricalmyrical-web-v2.web.app, kept out of search engines until the cutover). The file keeps its name
# so keep-refresh-alive.yml and the schedule history stay put.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Same exact CLI version as deploy-firebase.yml (scripts/hostingConfig.test.ts keeps them equal): the Hosting deploy
# holds a Firebase key, so a new release must not run with it unreviewed.
env:
  FIREBASE_TOOLS_VERSION: 15.32.1
  FIREBASE_PROJECT: lyricalmyrical-web-v2

jobs:
  # Deploy order contract (CLAUDE.md): Firestore rules, indexes and Functions go live BEFORE the frontend that
  # depends on them. When this push also changed a path deploy-firebase.yml watches, wait for that run and
  # require it to succeed. Scheduled and manual builds change no backend files, so they pass straight through.
  firebase-first:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Firebase deploy when this push changed backend files
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Keep this list identical to `on.push.paths` in deploy-firebase.yml.
          WATCHED='^(firestore\.rules|firestore\.indexes\.json|storage\.rules|firebase\.json|functions/.*|\.github/workflows/deploy-firebase\.yml)$'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare; treating backend files as changed."
            expect=true
          else
            files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || {
              echo "::error::Could not list the files changed by this push, so the Firebase deploy order cannot be checked. Re-run this workflow."
              exit 1
            }
            if printf '%s\n' "$files" | grep -Eq "$WATCHED"; then expect=true; else expect=false; fi
          fi
          if [ "$expect" != "true" ]; then
            echo "No Firebase files changed in this push; publishing the frontend straight away."
            exit 0
          fi
          echo "Backend files changed; waiting for the Firebase deploy of $SHA to finish first."
          deadline=$(( $(date +%s) + 2100 ))
          seen_at=$(( $(date +%s) + 300 ))
          while :; do
            run=$(gh run list --repo "$REPO" --workflow deploy-firebase.yml --commit "$SHA" --event push \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(printf '%s' "$run" | jq -r .status)
              if [ "$status" = "completed" ]; then
                conclusion=$(printf '%s' "$run" | jq -r .conclusion)
                if [ "$conclusion" = "success" ]; then echo "Firebase deploy succeeded; continuing."; exit 0; fi
                echo "::error::The Firebase deploy ended as '$conclusion' ($(printf '%s' "$run" | jq -r .url)). The frontend was NOT published, so it cannot run ahead of its rules and Functions. Fix it and re-run, or start this workflow by hand once the backend is current."
                exit 1
              fi
            elif [ "$(date +%s)" -gt "$seen_at" ]; then
              echo "::error::Backend files changed but no Firebase deploy run appeared for $SHA within 5 minutes."
              exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then echo "::error::Timed out waiting for the Firebase deploy."; exit 1; fi
            sleep 20
          done

  deploy:
    needs: firebase-first
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves a project site at /<repository name>/. Take the address from the repository's current name
      # so renaming the repository can never leave the build pointing at a sub-path that 404s (unstyled site).
      # A custom domain sets the repository variable SITE_URL (e.g. https://shop.example.com) instead.
      - name: Site address
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${CUSTOM_SITE_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          url="${url%/}"
          path="$(node -e 'process.stdout.write(new URL(process.argv[1]).pathname.replace(/\/+$/, ""))' "$url")"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "SITE_BASE=$path/" >> "$GITHUB_ENV"
          echo "Building for $url (base $path/)"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check published content
        id: published
        if: github.event_name == 'schedule'
        run: node scripts/check-published-change.mjs

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - name: Build with reCAPTCHA App Check configuration
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
        run: |
          case "$VITE_APP_CHECK_MODE" in off|monitor|enforce) ;; *) echo "::error::Invalid APP_CHECK_MODE"; exit 1 ;; esac
          if [ "$VITE_APP_CHECK_MODE" = "enforce" ] && [ -z "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "::error::Register reCAPTCHA Enterprise and set RECAPTCHA_ENTERPRISE_SITE_KEY before enforcing App Check."
            exit 1
          fi
          pnpm run build
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      # Pages replaces the whole site; keep the previous build's CSS/JS so pages cached before this deploy still load styled.
      - name: Keep the previous deploy's assets
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        run: node scripts/carry-previous-assets.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        with:
          path: ./dist

      - id: deployment
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

  # Firebase Hosting, side by side with Pages. Built without any secret (dependencies and Playwright run here);
  # the key only appears in deploy-hosting, which installs nothing.
  build-hosting:
    needs: firebase-first
    # Off until the owner sets the repository variable FIREBASE_HOSTING_ENABLED=true (after the Hosting site and its
    # service account exist), so the 15-minute schedule never rebuilds for, or fails against, a host that isn't set up.
    # A manual run from another branch must never publish it (the Firebase key has no branch rule).
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_HOSTING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      built: ${{ steps.result.outputs.built }}
    env:
      # Hard-coded on purpose until the cutover: vars.SITE_URL still drives the live GitHub Pages build above.
      SITE_URL: https://lyricalmyrical-web-v2.web.app
      SITE_BASE: /
      # 404.html is the app shell: unknown URLs get a real 404 that still shows the editable missing page.
      SPA_FALLBACK: shell
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Compared with the marker on web.app itself, so each host catches up on its own.
      - name: Check published content
        id: published
        if: github.event_name == 'schedule'
        run: node scripts/check-published-change.mjs

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'

      - name: Build with reCAPTCHA App Check configuration
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          VITE_APP_CHECK_MODE: ${{ vars.APP_CHECK_MODE || 'monitor' }}
        run: |
          case "$VITE_APP_CHECK_MODE" in off|monitor|enforce) ;; *) echo "::error::Invalid APP_CHECK_MODE"; exit 1 ;; esac
          if [ "$VITE_APP_CHECK_MODE" = "enforce" ] && [ -z "$VITE_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "::error::Register reCAPTCHA Enterprise and set RECAPTCHA_ENTERPRISE_SITE_KEY before enforcing App Check."
            exit 1
          fi
          pnpm run build

      # Firebase Hosting also replaces the whole site; keep the previous build's CSS/JS for tabs opened before it.
      - name: Keep the previous deploy's assets
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        run: node scripts/carry-previous-assets.mjs

      - name: Check routing and headers in the Hosting emulator
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        run: npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" emulators:exec --only hosting --project demo-lyricalmyrical "node scripts/hosting-smoke.mjs --expect-noindex"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        with:
          name: hosting-dist
          path: dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - id: result
        if: github.event_name != 'schedule' || steps.published.outputs.changed == 'true'
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy-hosting:
    needs: build-hosting
    if: needs.build-hosting.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: firebase-hosting
      url: https://lyricalmyrical-web-v2.web.app
    steps:
      # Only the repository's own scripts and the pinned CLI run next to the key: no pnpm install, no Playwright.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: hosting-dist
          path: dist

      - name: Deploy to Firebase Hosting
        id: deploy
        env:
          # A service account with only "Firebase Hosting Admin" (preferred), else the backend deploy key.
          HOSTING_KEY: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT }}
          FALLBACK_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          key="${HOSTING_KEY:-$FALLBACK_KEY}"
          if [ -z "$key" ]; then
            echo "::warning::No FIREBASE_HOSTING_SERVICE_ACCOUNT (or FIREBASE_SERVICE_ACCOUNT) secret, so Firebase Hosting was not updated. GitHub Pages is unaffected."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$key" > "$RUNNER_TEMP/hosting-sa.json"
          trap 'rm -f "$RUNNER_TEMP/hosting-sa.json"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/hosting-sa.json"
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy --only hosting \
            --project "$FIREBASE_PROJECT" --non-interactive \
            --message "${GITHUB_SHA::12} (${GITHUB_EVENT_NAME})"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Check the live site
        if: steps.deploy.outputs.deployed == 'true'
        env:
          SITE_URL: https://lyricalmyrical-web-v2.web.app
        run: node scripts/hosting-smoke.mjs --base "$SITE_URL" --expect-noindex
